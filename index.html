d b{display:block;font-size:16px}.card small{color:var(--muted)}.pill{display:inline-flex;border:1px solid #28506d;background:#0c2438;padding:3px 7px;border-radius:999px;font-size:10px;margin:4px 4px 0 0}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{font-size:26px;display:block}.stat span{color:var(--muted);font-size:12px}.controls{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:22px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:5px;color:var(--muted);font-size:12px}.controls label.grow{flex:1;min-width:220px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px}.row img{width:58px;height:58px;border-radius:12px;object-fit:cover}.row small,.muted{color:var(--muted)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chips span{font-size:10px;padding:4px 7px;background:#081728;border:1px solid var(--line);border-radius:999px}.score{text-align:center;padding:6px 10px;background:#071421;border:1px solid var(--line);border-radius:10px}.score b{display:block;font-size:20px}.section{margin-top:30px}.section h2{margin-bottom:10px}.team{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.teamTop{display:flex;justify-content:space-between;gap:14px;align-items:center}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.slot{background:#081728;border:1px solid var(--line);border-radius:13px;padding:10px}.slot b{display:block}.slot small{color:var(--muted)}.saved{display:grid;gap:8px}.saved article{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:14px}.gapCard{ const SUPA_URL='https://qdqrvgeiadoxtyorbbvn.supabase.co',SUPA_KEY='sb_publishable_Lw5UbUaRVNwuzAfalP5E8w_yhpmwLEn';
let DB=[],view='database',selected=null,roster=[],savedTeams=[],clears=[],supabase=null,user=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
async function inflateSeed(){const bin=Uint8Array.from(atob(COMPRESSED),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(ds)).text())}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function norm(x){return String(x||'').toLowerCase()}
function loadLocal(k,d=[]){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function saveLocal(k,v){localStorage.setItem(k,JSON.stringify(v))}
function findChar(id){return DB.find(c=>c.id===id)}
async function initSupabase(){try{const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');supabase=m.createClient(SUPA_URL,SUPA_KEY);const r=await supabase.auth.getUser();user=r.data.user||null;if(user)await loadCloudProgress();}catch(e){console.warn(e)}}
async function loadCloudProgress(){if(!supabase||!user)return;const [r,t,c]=await Promise.all([supabase.from('player_roster').select('*').eq('user_id',user.id),supabase.from('saved_teams').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),supabase.from('stage_clears').select('*').eq('user_id',user.id).order('cleared_at',{ascending:false})]);if(!r.error)roster=r.data||[];if(!t.error)savedTeams=t.data||[];if(!c.error)clears=c.data||[];}
async function persistRoster(e){if(supabase&&user){await supabase.from('player_roster').upsert({...e,user_id:user.id,updated_at:new Date().toISOString()},{onConflict:'user_id,character_id'})}else{const i=roster.findIndex(x=>x.character_id===e.character_id);if(i>=0)roster[i]=e;else roster.push(e);saveLocal('mff-roster',roster)}}
async function deleteRoster(id){if(supabase&&user)await supabase.from('player_roster').delete().eq('user_id',user.id).eq('character_id',id);roster=roster.filter(x=>x.character_id!==id);saveLocal('mff-roster',roster);render()}
function stageKey(s){return `${s.mode}|${s.boss||''}|${s.stage}`}
function linksFor(c,mode,boss,stage){if(mode==='wbl')return (c.wbl||[]).filter(x=>(!boss||x.boss===boss)&&String(x.stage_range)===String(stage)).map(x=>x.role);if(mode==='shadowland')return (c.shadowland||[]).filter(x=>String(x.stage)===String(stage)).map(x=>x.role||'recommended');return (c.dispatch||[]).filter(x=>String(x.stage)===String(stage)).map(()=> 'recommended')}
function tierWeight(c){return ({'beyond meta':50,'high meta':42,'low meta':34,'useful':25,'lead/support meta':32,'lead/support useful':24,'useable':12})[norm(c.tierCategory)]||0}
function ownedWeight(r){if(!r)return 0;let n=20,t=norm(r.tier);if(t.includes('t4'))n+=18;else if(t.includes('t3'))n+=12;else if(t.includes('awak'))n+=9;if(r.uniform_id)n+=7;if(r.ctp)n+=6;if(r.artifact_owned)n+=3;return n}
function hasTag(c,t){return norm(c.tierTags).includes(t)}
function modeScore(c,m){return m==='wbl'?Number(c.t4?.wbl||0)*3:m==='dispatch'?Number(c.t4?.farming||0)*3:tierWeight(c)*.2}
function recommendation(mode,boss,stage,ownedOnly){let rm=new Map(roster.map(x=>[x.character_id,x]));let out=[];for(const c of DB){let roles=linksFor(c,mode,boss,stage);if(!roles.length)continue;let r=rm.get(c.id);if(ownedOnly&&!r)continue;let role=roles.includes('required')?'required':roles.includes('recommended')?'recommended':roles.includes('support')?'support':roles[0];let score=tierWeight(c)+ownedWeight(r)+modeScore(c,mode)+(role==='required'?55:role==='recommended'?45:role==='support'?30:15);out.push({c,r,role,score})}return out.sort((a,b)=>b.score-a.score)}
function buildTeams(mode,boss,stage,ownedOnly){let pool=recommendation(mode,boss,stage,ownedOnly);if(pool.length<3)return[];let dps=[...pool].sort((a,b)=>(b.score+(b.role==='recommended'?50:b.role==='required'?46:b.role==='support'?-20:0))-(a.score+(a.role==='recommended'?50:a.role==='required'?46:a.role==='support'?-20:0))).slice(0,10);let leads=[...pool].sort((a,b)=>(b.score*.55+(hasTag(b.c,'leadership')?58:0))-(a.score*.55+(hasTag(a.c,'leadership')?58:0))).slice(0,12);let supports=[...pool].sort((a,b)=>(b.score*.55+(b.role==='support'?62:0)+(hasTag(b.c,'support')?42:0))-(a.score*.55+(a.role==='support'?62:0)+(hasTag(a.c,'support')?42:0))).slice(0,12);let res=[],seen=new Set;for(const d of dps)for(const l of leads)for(const s of supports){if(new Set([d.c.id,l.c.id,s.c.id]).size<3)continue;let ids=[d.c.id,l.c.id,s.c.id].sort().join('|');if(seen.has(ids))continue;seen.add(ids);let score=d.score+l.score+s.score+(hasTag(l.c,'leadership')?12:0)+(s.role==='support'?14:hasTag(s.c,'support')?8:0);res.push({id:`${d.c.id}-${l.c.id}-${s.c.id}`,score,dps:d.c,lead:l.c,support:s.c,mode,boss,stage})}return res.sort((a,b)=>b.score-a.score).slice(0,8)}
function opts(mode){if(mode==='wbl'){let bosses=[...new Set(DB.flatMap(c=>(c.wbl||[]).map(x=>x.boss)))].filter(Boolean).sort();let stages=[...new Set(DB.flatMap(c=>(c.wbl||[]).map(x=>String(x.stage_range))))].filter(Boolean);return{bosses,stages}}if(mode==='shadowland')return{bosses:[],stages:[...new Set(DB.flatMap(c=>(c.shadowland||[]).map(x=>String(x.stage))))].sort((a,b)=>+a-+b)};return{bosses:[],stages:[...new Set(DB.flatMap(c=>(c.dispatch||[]).map(x=>String(x.stage))))].sort()}}
function gapAnalysis(){let owned=new Set(roster.map(r=>r.character_id)),cleared=new Set(clears.map(stageKey)),map=new Map;for(const c of DB){for(const x of c.wbl||[]){let s={mode:'wbl',boss:x.boss,stage:String(x.stage_range)};if(cleared.has(stageKey(s)))continue;let k=stageKey(s);if(!map.has(k))map.set(k,{s,ids:new Set});map.get(k).ids.add(c.id)}for(const x of c.shadowland||[]){let s={mode:'shadowland',stage:String(x.stage)};if(cleared.has(stageKey(s)))continue;let k=stageKey(s);if(!map.has(k))map.set(k,{s,ids:new Set});map.get(k).ids.add(c.id)}for(const x of c.dispatch||[]){let s={mode:'dispatch',stage:String(x.stage)};if(cleared.has(stageKey(s)))continue;let k=stageKey(s);if(!map.has(k))map.set(k,{s,ids:new Set});map.get(k).ids.add(c.id)}}let unlock=new Map;for(const {s,ids} of map.values()){let own=[...ids].filter(id=>owned.has(id));if(own.length!==2)continue;for(const id of ids)if(!owned.has(id)){let a=unlock.get(id)||[];a.push(s);unlock.set(id,a)}}return [...unlock].map(([id,stages])=>({c:findChar(id),stages,n:stages.length})).filter(x=>x.c).sort((a,b)=>b.n-a.n).slice(0,20)}
function nav(){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
function setView(v){view=v;nav()}
function shell(body){$('#app').innerHTML=`<div class="wrap">${body}</div>`}
function characterCard(c){return `<button class="card" onclick="openChar('${c.id}')"><img src="${esc(c.image)}" onerror="this.style.opacity=.2"><div style="text-align:left"><b>${esc(c.name)}</b><small>${esc(c.latestUniform||'No uniform')}</small><div><span class="pill">${esc(c.type||'?')}</span><span class="pill">${esc(c.highestTier||'?')}</span></div></div></button>`}
function renderDatabase(){let q=norm($('#qcache')?.value||''),type=$('#typecache')?.value||'';let rows=DB.filter(c=>(!q||norm(`${c.name} ${c.aliases} ${c.latestUniform} ${c.metaCtpPve} ${c.metaCtpPvp}`).includes(q))&&(!type||c.type===type));shell(`<section class="hero"><p class="eyebrow">MARVEL FUTURE FIGHT COMPANION</p><h1>Find the answer.<br>Build the character.</h1><p>Search ${DB.length} characters, uniforms, CTP recommendations, rotations, rankings and game-mode usage.</p></section><div class="searchbar"><input id="qcache" placeholder="Search character, uniform, CTP…" value="${esc(q)}"><select id="typecache"><option value="">All types</option>${['combat','blast','speed','universal'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary" id="go">Search</button></div><p class="muted">${rows.length} results</p><div class="grid">${rows.map(characterCard).join('')}</div>`);$('#go').onclick=renderDatabase;$('#qcache').onkeydown=e=>{if(e.key==='Enter')renderDatabase()}}
function renderRoster(){let rows=roster.map(r=>({r,c:findChar(r.character_id)})).filter(x=>x.c);shell(`<section class="hero"><p class="eyebrow">PLAYER ROSTER</p><h1>My characters</h1><p>Track what you own so recommendations and team building can use your actual account.</p></section><div class="statrow"><div class="stat"><b>${rows.length}</b><span>owned characters</span></div><div class="stat"><b>${rows.filter(x=>norm(x.r.tier).includes('t4')).length}</b><span>T4 characters</span></div><div class="stat"><b>${rows.filter(x=>x.r.ctp).length}</b><span>CTPs tracked</span></div><div class="stat"><b>${user?'☁':'▣'}</b><span>${user?'cloud synced':'saved on device'}</span></div></div><div class="controls"><label class="grow">Add character<select id="addChar"><option value="">Choose…</option>${DB.filter(c=>!roster.some(r=>r.character_id===c.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><button class="primary" onclick="addRoster()">Add</button></div><div class="list">${rows.map(x=>`<div class="row"><img src="${esc(x.c.image)}"><div><b>${esc(x.c.name)}</b><div class="chips"><span>${esc(x.r.tier||x.c.highestTier||'tier not set')}</span><span>${esc(x.r.uniform_id||x.c.latestUniform||'uniform not set')}</span><span>${esc(x.r.ctp||'CTP not set')}</span>${x.r.artifact_owned?'<span>artifact owned</span>':''}</div><button class="secondary" style="margin-top:7px" onclick="editRoster('${x.c.id}')">Edit</button></div><button class="secondary danger" onclick="deleteRoster('${x.c.id}')">Remove</button></div>`).join('')||'<p class="muted">Your roster is empty. Add a character above.</p>'}</div>` )}
async function addRoster(){let id=$('#addChar').value;if(!id)return;await persistRoster({character_id:id,tier:findChar(id)?.highestTier||'',level:null,uniform_id:findChar(id)?.latestUniform||'',ctp:'',artifact_owned:false,notes:''});renderRoster()}
function editRoster(id){let c=findChar(id),r=roster.find(x=>x.character_id===id)||{character_id:id};modal(`<button class="close" onclick="closeModal()">×</button><h2>${esc(c.name)}</h2><div class="controls" style="display:grid"><label>Tier<input id="rtier" value="${esc(r.tier||'')}"></label><label>Level<input id="rlevel" type="number" value="${esc(r.level||'')}"></label><label>Owned uniform<input id="runi" value="${esc(r.uniform_id||c.latestUniform||'')}"></label><label>CTP<input id="rctp" value="${esc(r.ctp||'')}"></label><label><input id="rart" type="checkbox" ${r.artifact_owned?'checked':''}> Artifact owned</label><label>Notes<textarea id="rnotes">${esc(r.notes||'')}</textarea></label><button class="primary" onclick="saveRosterEdit('${id}')">Save</button></div>` )}
async function saveRosterEdit(id){let e={character_id:id,tier:$('#rtier').value,level:+$('#rlevel').value||null,uniform_id:$('#runi').value,ctp:$('#rctp').value,artifact_owned:$('#rart').checked,notes:$('#rnotes').value};let i=roster.findIndex(x=>x.character_id===id);if(i>=0)roster[i]=e;else roster.push(e);await persistRoster(e);closeModal();renderRoster()}
function modeControls(prefix,runfn){return `<div class="controls"><label>Mode<select id="${prefix}mode"><option value="wbl">World Boss</option><option value="shadowland">Shadowland+</option><option value="dispatch">Dispatch</option></select></label><label id="${prefix}bossWrap">Boss<select id="${prefix}boss"></select></label><label>Stage<select id="${prefix}stage"></select></label><label><input id="${prefix}owned" type="checkbox" checked> My roster only</label><button class="primary" id="${prefix}run">${runfn}</button></div>`}
function wireMode(prefix,cb){let m=$('#'+prefix+'mode'),b=$('#'+prefix+'boss'),s=$('#'+prefix+'stage'),bw=$('#'+prefix+'bossWrap');function fill(){let o=opts(m.value);b.innerHTML=o.bosses.map(x=>`<option>${x}</option>`).join('');s.innerHTML=o.stages.map(x=>`<option>${x}</option>`).join('');bw.classList.toggle('hidden',m.value!=='wbl')}m.onchange=()=>{fill();cb()};b.onchange=cb;s.onchange=cb;$('#'+prefix+'owned').onchange=cb;$('#'+prefix+'run').onclick=cb;fill();cb()}
function renderRecommendations(){shell(`<section class="hero"><p class="eyebrow">ROSTER-AWARE RECOMMENDATIONS</p><h1>Who can I use?</h1><p>Choose a stage and compare the guide against your saved roster.</p></section>${modeControls('rec','Refresh')}<div id="recOut"></div>`);wireMode('rec',()=>{let m=$('#recmode').value,b=$('#recboss').value,s=$('#recstage').value,o=$('#recowned').checked,rows=recommendation(m,b,s,o);$('#recOut').innerHTML=`<p class="muted">${rows.length} matches</p><div class="list">${rows.map((x,i)=>`<div class="row"><img src="${esc(x.c.image)}"><div><b>${esc(x.c.name)}</b><small>${esc(x.role)} · ${esc(x.c.latestUniform||'')}</small><div class="chips">${x.r?`<span>${esc(x.r.tier||'owned')}</span>`:'<span>not owned</span>'}${x.c.metaCtpPve&&x.c.metaCtpPve!=='-'?`<span>Guide CTP: ${esc(x.c.metaCtpPve)}</span>`:''}</div></div><div class="score"><b>${Math.round(x.score)}</b><small>match</small></div></div>`).join('')||'<p class="muted">No matches with these filters.</p>'}</div>`})}
function renderTeamBuilder(){shell(`<section class="hero"><p class="eyebrow">ROSTER-AWARE TEAM BUILDER</p><h1>Build me a team.</h1><p>Ranked DPS + Lead + Support combinations from stage-eligible characters.</p></section>${modeControls('team','Build teams')}<div id="teamOut"></div>`);wireMode('team',()=>{let m=$('#teammode').value,b=$('#teamboss').value,s=$('#teamstage').value,o=$('#teamowned').checked,rows=buildTeams(m,b,s,o);$('#teamOut').innerHTML=`<p class="muted">${rows.length} team suggestions</p>${rows.map((t,i)=>`<article class="team"><div class="teamTop"><div><b>#${i+1} · Match ${Math.round(t.score)}</b><small class="muted"> ${m==='wbl'?esc(b)+' · ':''}${esc(s)}</small></div><div><button class="secondary" onclick='saveTeam(${JSON.stringify(t).replace(/'/g,"&#39;")})'>Save</button> <button class="primary" onclick='saveTeam(${JSON.stringify(t).replace(/'/g,"&#39;")},true)'>Save + Clear</button></div></div><div class="slots"><div class="slot"><small>DPS</small><b>${esc(t.dps.name)}</b></div><div class="slot"><small>LEAD</small><b>${esc(t.lead.name)}</b></div><div class="slot"><small>SUPPORT</small><b>${esc(t.support.name)}</b></div></div></article>`).join('')||'<p class="muted">Not enough eligible characters for a full three-person team.</p>'}`})}
async function saveTeam(t,markClear=false){let row={id:crypto.randomUUID(),name:`${t.mode.toUpperCase()} ${t.boss||''} ${t.stage}`,mode:t.mode,boss:t.boss||null,stage:String(t.stage),score:t.score,team:{dps:{character:t.dps},lead:{character:t.lead},support:{character:t.support}},created_at:new Date().toISOString(),updated_at:new Date().toISOString()};if(supabase&&user){let x=await supabase.from('saved_teams').insert({...row,user_id:user.id}).select().single();if(!x.error)row=x.data}else{savedTeams.unshift(row);saveLocal('mff-teams',savedTeams)}if(markClear)await markStageClear(t,row.id);alert(markClear?'Team saved and stage marked cleared.':'Team saved.')}
async function markStageClear(t,teamId){let ex=clears.find(c=>stageKey(c)===stageKey(t));if(ex)return;let row={id:crypto.randomUUID(),mode:t.mode,boss:t.boss||null,stage:String(t.stage),saved_team_id:teamId,cleared_at:new Date().toISOString()};if(supabase&&user){let x=await supabase.from('stage_clears').insert({...row,user_id:user.id}).select().single();if(!x.error)row=x.data}clears.unshift(row);saveLocal('mff-clears',clears)}
function renderProgress(){let gaps=gapAnalysis();shell(`<section class="hero"><p class="eyebrow">PLAYER PROGRESS</p><h1>What should I build next?</h1><p>Track teams and clears, then identify single-character investments that open the most additional guide stages.</p></section><div class="statrow"><div class="stat"><b>${roster.length}</b><span>roster characters</span></div><div class="stat"><b>${savedTeams.length}</b><span>saved teams</span></div><div class="stat"><b>${clears.length}</b><span>tracked clears</span></div><div class="stat"><b>${gaps[0]?.n||0}</b><span>best next-build unlocks</span></div></div><section class="section"><h2>Highest-impact next builds</h2>${gaps.map((g,i)=>`<div class="gapCard"><img src="${esc(g.c.image)}"><div><b>#${i+1} · ${esc(g.c.name)}</b><small>${esc(g.c.latestUniform||'')}</small><div class="chips">${g.stages.slice(0,8).map(s=>`<span>${s.mode==='wbl'?esc(s.boss)+' '+esc(s.stage):s.mode==='shadowland'?'SL+ '+esc(s.stage):'Dispatch '+esc(s.stage)}</span>`).join('')}</div></div><div class="score"><b>${g.n}</b><small>stages</small></div></div>`).join('')||'<p class="muted">No one-character gaps found yet.</p>'}</section><div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div><h2>Saved teams</h2><div class="saved">${savedTeams.map(x=>`<article><div><b>${esc(x.name||x.mode+' '+x.stage)}</b><small class="muted">${esc(x.stage)}</small></div></article>`).join('')||'<p class="muted">None yet.</p>'}</div></div><div><h2>Tracked clears</h2><div class="saved">${clears.map(x=>`<article><div><b>${esc(x.mode==='wbl'?x.boss:x.mode)} · ${esc(x.stage)}</b><small class="muted">${new Date(x.cleared_at).toLocaleDateString()}</small></div></article>`).join('')||'<p class="muted">None yet.</p>'}</div></div></div>` )}
function renderLogin(){shell(`<section class="hero"><p class="eyebrow">ACCOUNT</p><h1>${user?'Signed in':'Sync your progress'}</h1><p>${user?`Signed in as ${esc(user.email)}. Your roster, saved teams and clears sync through Supabase.`:'You can use the whole app without an account. Sign in by email to sync roster and progress across devices.'}</p></section>${user?'<button class="primary" id="signout">Sign out</button>':`<div class="controls"><label class="grow">Email<input id="email" type="email" placeholder="you@example.com"></label><button class="primary" id="signin">Email me a sign-in link</button></div><div class="notice">Magic-link redirects depend on the deployed domain being allowed in Supabase Auth settings. Local/device progress still works if sign-in is not configured yet.</div>`}`);if(user)$('#signout').onclick=async()=>{await supabase.auth.signOut();user=null;roster=loadLocal('mff-roster',[]);savedTeams=loadLocal('mff-teams',[]);clears=loadLocal('mff-clears',[]);renderLogin()};else $('#signin').onclick=async()=>{let email=$('#email').value;if(!email)return;let r=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin}});alert(r.error?r.error.message:'Check your email for the sign-in link.')}}
function openChar(id){let c=findChar(id);if(!c)return;modal(`<button class="close" onclick="closeModal()">×</button><div class="profileHead"><img src="${esc(c.image)}"><div><p class="eyebrow">${esc(c.type||'CHARACTER')}</p><h2 style="font-size:32px;margin:0">${esc(c.name)}</h2><p class="muted">${esc(c.latestUniform||'')}</p></div></div><div class="kv"><div><small>Highest tier</small><b>${esc(c.highestTier||'—')}</b></div><div><small>Attack</small><b>${esc(c.attackType||'—')}</b></div><div><small>ISO-8</small><b>${esc(c.bestIso||'—')}</b></div><div><small>Meta CTP PvE</small><b>${esc(c.metaCtpPve||'—')}</b></div><div><small>Meta CTP PvP</small><b>${esc(c.metaCtpPvp||'—')}</b></div><div><small>Artifact</small><b>${esc(c.artifactName||c.needsArtifact||'—')}</b></div><div><small>Tier list</small><b>${esc(c.tierCategory||'—')} ${c.tierRank?`#${c.tierRank}`:''}</b></div><div><small>Rotation</small><b>${esc(c.procRotation||'—')}</b></div></div><section class="section"><h3>Uniforms</h3><div class="chips">${(c.uniforms||[]).map(u=>`<span>${u.is_latest?'NEWEST · ':''}${esc(u.uniform_name)}</span>`).join('')||'<span>No uniform history</span>'}</div></section><section class="section"><h3>Game mode links</h3><p class="muted">WBL ${c.wbl?.length||0} · Shadowland+ ${c.shadowland?.length||0} · Dispatch ${c.dispatch?.length||0} · Story ${c.story?.length||0}</p></section>` )}
function modal(x){$('#modal').innerHTML=`<div class="modal"><div class="modalCard">${x}</div></div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
function render(){if(view==='database')renderDatabase();else if(view==='roster')renderRoster();else if(view==='recommend')renderRecommendations();else if(view==='team')renderTeamBuilder();else if(view==='progress')renderProgress();else renderLogin();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
async function start(){DB=await inflateSeed();roster=loadLocal('mff-roster',[]);savedTeams=loadLocal('mff-teams',[]);clears=loadLocal('mff-clears',[]);await initSupabase();$$('.nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));render();}
start();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})</script></body></html>
